[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmia-webhooker"
version = "0.1.0"
description = "OpenMIA webhook-based observability collectors for local agent integrations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "OpenMIA" }
]
keywords = ["openmia", "observability", "traces", "codex", "claude-code", "webhook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/openmia-ai/openmia-webhooker"
Source = "https://github.com/openmia-ai/openmia-webhooker"
Issues = "https://github.com/openmia-ai/openmia-webhooker/issues"
Documentation = "https://docs.openmia.ai/app/observation/traces"

[project.scripts]
openmia-webhooker = "openmia_webhooker.cli:main"

[tool.setuptools]
packages = [
  "openmia_webhooker",
  "openmia_webhooker.adapters",
]
